name: Build APK

# Every branch push produces a signed APK artifact. Pushing a version tag also publishes that
# APK to GitHub Releases, where the app's updater can find it. Annotated tags supply release notes.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

# A newer push to the same branch makes the build still running for it pointless.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The keystore lives only in repository secrets; without it the APK would be signed with a
      # throwaway key and could not be installed over the app on the phone.
      - name: Restore signing key
        env:
          YOUCLOUD_KEYSTORE_BASE64: ${{ secrets.YOUCLOUD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$YOUCLOUD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret YOUCLOUD_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$YOUCLOUD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/youcloud-release.jks"

      # app/build.gradle.kts reads the key as the youcloud.* Gradle properties, the same names
      # local.properties uses on the computer.
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUCLOUD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YOUCLOUD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YOUCLOUD_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pyoucloud.storeFile="$RUNNER_TEMP/youcloud-release.jks" \
            -Pyoucloud.storePassword="$KEYSTORE_PASSWORD" \
            -Pyoucloud.keyAlias="$KEY_ALIAS" \
            -Pyoucloud.keyPassword="$KEY_PASSWORD"

      # Gradle falls back to the debug key without a word when the release key is missing, and
      # such an APK refuses to install over the app. Better a red build than that.
      - name: Check the APK is signed with the release key
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | grep "certificate DN"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi
          name=$(basename "$apk" .apk)
          echo "name=$name-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # gh --notes-from-tag reads the local annotated tag, not only its remote metadata.
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-apk

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh "$GITHUB_REF_NAME" release-apk
